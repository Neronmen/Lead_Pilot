name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same images as docker-compose.yml. e2e tests run against these.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: leadpilot
          POSTGRES_DB: leadpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadpilot -d leadpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Invite emails go here (the Mailpit e2e test reads them back over its API).
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 10

    # No .env in CI: the apps read these straight from the environment.
    # Only the test database exists here, so both URLs point at it.
    env:
      DATABASE_URL: postgresql://leadpilot:leadpilot@localhost:5432/leadpilot_test
      DATABASE_URL_TEST: postgresql://leadpilot:leadpilot@localhost:5432/leadpilot_test
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAILPIT_API_URL: http://localhost:8025
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
