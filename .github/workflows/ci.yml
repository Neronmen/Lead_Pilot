name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # Same images as docker-compose.yml. e2e tests run against these.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: leadpilot
          POSTGRES_DB: leadpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadpilot -d leadpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Invite emails go here (the Mailpit e2e test reads them back over its API).
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 10

    # No .env in CI: the apps read these straight from the environment.
    # Only the test database exists here, so both URLs point at it.
    env:
      DATABASE_URL: postgresql://leadpilot:leadpilot@localhost:5432/leadpilot_test
      DATABASE_URL_TEST: postgresql://leadpilot:leadpilot@localhost:5432/leadpilot_test
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAILPIT_API_URL: http://localhost:8025
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

      # Real-browser render checks of the web app (mocked API; no database needed).
      - name: Install Chromium for the render checks
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:render
      - name: Keep the screenshots and the pass/fail table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-render-checks
          path: |
            apps/web/e2e/screenshots
            apps/web/e2e/results.md
            apps/web/e2e/test-results
          if-no-files-found: ignore
